name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-mcp-server:
    name: MCP Server (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci
      - name: Type check & build
        working-directory: mcp-server
        run: npm run build
      - name: Install Playwright browsers
        working-directory: mcp-server
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run tests
        working-directory: mcp-server
        # Two reporters: the default one so the log is readable, and the JSON
        # one so the doc-claims check can reuse this run's test total instead
        # of paying for a second full suite (which would mean a second
        # three-browser install).
        run: >-
          npx vitest run
          --reporter=default
          --reporter=json
          --outputFile.json=${{ runner.temp }}/vitest-report.json

      - name: Selector-recovery eval
        working-directory: mcp-server
        # docs/DESIGNED_FOR_AGENTS.md publishes a recovery rate. This is the
        # measurement behind that number, so it has to run on every push or
        # the number becomes a claim again. It runs against dist/ — the build
        # step above — because that is what ships.
        #
        # The floor is a regression gate rather than the target: the measured
        # overall rate is 83.3%, and a drop below 80% means the ranking got
        # worse, not that the corpus got unlucky.
        #
        # eval:report rather than eval — it writes the JSON and the Markdown
        # table that the upload step below publishes as a build artifact.
        run: npm run eval:report

      - name: Documentation claims match the tree
        # The README advertises "51 MCP tools", "7 binaries", "219 tests", and
        # — since the eval landed — a published selector-recovery rate. Numbers
        # written in prose drift silently: nothing breaks when a tool is added.
        # This recounts every one of them and fails on any disagreement, so the
        # claims stay true by construction rather than by diligence.
        #
        # Runs after the eval so that eval-results.json exists; without
        # --eval-json the recovery-rate claims are skipped with a warning.
        run: >-
          node scripts/check-doc-claims.mjs
          --vitest-json ${{ runner.temp }}/vitest-report.json
          --eval-json eval-results.json

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selector-recovery-eval
          path: |
            eval-results.json
            eval-table.md
          if-no-files-found: ignore

  check-frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build

  build-tauri:
    name: Build Desktop App
    needs: [check-mcp-server, check-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          # Cross-compile the Intel build on the Apple-Silicon runner — the
          # macos-13 (Intel) hosted runners are unavailable to this account and
          # the job otherwise queues for the 24h maximum. Safe: all shipped
          # mcp-server production deps are arch-independent and fsevents (via
          # Playwright) is a universal binary.
          - platform: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Install MCP server
        working-directory: mcp-server
        run: npm ci && npm run build
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: webmobai-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
