name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-mcp-server:
    name: MCP Server (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci
      - name: Type check & build
        working-directory: mcp-server
        run: npm run build
      - name: Install Playwright browsers
        working-directory: mcp-server
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run tests
        working-directory: mcp-server
        run: npm test

  check-frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build

  build-tauri:
    name: Build Desktop App
    needs: [check-mcp-server, check-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          # Cross-compile the Intel build on the Apple-Silicon runner — the
          # macos-13 (Intel) hosted runners are unavailable to this account and
          # the job otherwise queues for the 24h maximum. Safe: all shipped
          # mcp-server production deps are arch-independent and fsevents (via
          # Playwright) is a universal binary.
          - platform: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Install MCP server
        working-directory: mcp-server
        run: npm ci && npm run build
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: webmobai-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
