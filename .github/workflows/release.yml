name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-npm:
    name: Publish MCP Server to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install and build
        working-directory: mcp-server
        run: npm ci && npm run build
      - name: Publish to npm
        working-directory: mcp-server
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-and-release:
    name: Build & Release Desktop App
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          # Intel build is cross-compiled on the Apple-Silicon runner. The
          # macos-13 (Intel) hosted runners are unavailable to this account, so
          # that job queued for the 24h maximum and timed out every release
          # (which is why only the arm64 .dmg ever shipped). Cross-compiling is
          # safe here: every shipped mcp-server production dependency is
          # pure-JS / arch-independent, and the one native module (fsevents,
          # pulled by Playwright) is a universal binary.
          - platform: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Key by target so the two same-runner legs (aarch64 vs x86_64) don't
          # share a cache entry.
          key: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Install MCP server (dev deps for build)
        working-directory: mcp-server
        run: npm ci && npm run build
      - name: Slim MCP server to production deps (shipped in app bundle)
        working-directory: mcp-server
        run: rm -rf node_modules && npm ci --omit=dev
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "WebMobAI ${{ github.ref_name }}"
          releaseBody: "See [CHANGELOG.md](https://github.com/celikgo/webmobai/blob/main/CHANGELOG.md) for details."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
